<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>TeamFinder</title>
</head>
<body>
    <h1>Добро пожаловать в TeamFinder </h1>

    {% if request.user.is_authenticated %}
        <p>Вы вошли как: {{ request.user.name }} {{ request.user.surname }}</p>
        <p><a href="{% url 'logout' %}">Выйти</a></p>
    {% else %}
        <p><a href="{% url 'login' %}">Войти</a></p>
        <p><a href="{% url 'register' %}">Регистрация</a></p>
    {% endif %}

    <p><a href="/admin/">Админка</a></p>
</body>
</html>
